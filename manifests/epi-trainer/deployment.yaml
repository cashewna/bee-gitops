apiVersion: apps/v1
kind: Deployment
metadata:
  name: epi-trainer
  namespace: epi-trainer
  labels:
    app.kubernetes.io/name: epi-trainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epi-trainer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epi-trainer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: epi-trainer
          # Built on bee from /home/kk/Projects/epi-trainer at ff2a992 plus
          # the Dockerfile in that repository.
          image: docker.io/cashewna/epi-trainer:sha-ff2a992
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: JAVA_HOME
              value: /opt/java/openjdk
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
