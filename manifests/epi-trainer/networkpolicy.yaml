apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: epi-trainer
  namespace: epi-trainer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: epi-trainer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8765
  egress:
    # The judge does not need the network. Allow only cluster DNS so the JVM
    # and any transient resolver lookups behave normally.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
