apiVersion: v1
kind: Namespace
metadata:
  name: bulwark
  labels:
    app.kubernetes.io/name: bulwark
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bulwark-data
  namespace: bulwark
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulwark
  namespace: bulwark
  labels:
    app.kubernetes.io/name: bulwark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bulwark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulwark
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bulwark
          image: ghcr.io/bulwarkmail/webmail:1.21.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: JMAP_SERVER_URL
              value: https://mail.khong.dev
            - name: APP_NAME
              value: Khong Mail
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bulwark-data
---
apiVersion: v1
kind: Service
metadata:
  name: bulwark
  namespace: bulwark
spec:
  selector:
    app.kubernetes.io/name: bulwark
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Stalwart runs on the host and keeps its HTTP/JMAP listener on the private
# node address; pods reach it through these manual endpoints.
apiVersion: v1
kind: Service
metadata:
  name: stalwart-jmap
  namespace: bulwark
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Endpoints
metadata:
  name: stalwart-jmap
  namespace: bulwark
subsets:
  - addresses:
      - ip: 10.0.0.235
    ports:
      - name: http
        port: 8081
        protocol: TCP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mail-khong-dev
  namespace: bulwark
spec:
  secretName: bulwark-tls
  dnsNames:
    - mail.khong.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bulwark
  namespace: bulwark
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mail.khong.dev
      secretName: bulwark-tls
  rules:
    - host: mail.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bulwark
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bulwark-jmap
  namespace: bulwark
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mail.khong.dev
      secretName: bulwark-tls
  rules:
    - host: mail.khong.dev
      http:
        paths:
          - path: /jmap
            pathType: Prefix
            backend:
              service:
                name: stalwart-jmap
                port:
                  name: http
          - path: /.well-known/jmap
            pathType: Prefix
            backend:
              service:
                name: stalwart-jmap
                port:
                  name: http
