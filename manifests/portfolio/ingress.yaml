apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - portfolio.khong.dev
      secretName: portfolio-tls
  rules:
    - host: portfolio.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-http
  namespace: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
