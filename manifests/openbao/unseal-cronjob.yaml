apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-unseal
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-unseal
spec:
  # A single-node OpenBao stays sealed after every pod restart. The key is a
  # bootstrap credential in the openbao-unseal Secret, created out of band;
  # the API and the root token never live in this repository.
  schedule: "*/2 * * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: unseal
              image: quay.io/openbao/openbao:2.7.2
              imagePullPolicy: IfNotPresent
              env:
                - name: BAO_ADDR
                  value: http://openbao.openbao.svc:8200
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  rc=0
                  out=$(bao status 2>&1) || rc=$?
                  # Vault/OpenBao exit 2 when the server is sealed; 0 is open.
                  if [ "$rc" -eq 2 ]; then
                    bao operator unseal "$(cat /openbao/unseal/key)"
                  elif [ "$rc" -eq 0 ]; then
                    echo "openbao is not sealed"
                  else
                    echo "cannot read OpenBao status (exit $rc): $out" >&2
                    exit 1
                  fi
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: unseal
                  mountPath: /openbao/unseal
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: unseal
              secret:
                secretName: openbao-unseal
                defaultMode: 0440
            - name: tmp
              emptyDir: {}
