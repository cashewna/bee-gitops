apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: burrow
  namespace: burrow
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: burrow-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jam.khong.dev
      secretName: burrow-tls
  rules:
    - host: jam.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: burrow
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: burrow-http
  namespace: burrow
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: burrow-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jam.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: burrow
                port:
                  name: http
