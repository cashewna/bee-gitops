apiVersion: apps/v1
kind: Deployment
metadata:
  name: burrow
  namespace: burrow
  labels:
    app.kubernetes.io/name: burrow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: burrow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burrow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: burrow
          image: docker.io/cashewna/burrow:2026-11-14-v6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: AJ_DATA_DIR
              value: /data/state
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: burrow-data
        - name: tmp
          emptyDir: {}
