apiVersion: v1
kind: Service
metadata:
  name: ticket-queue-db
  namespace: ticket-queue
  labels:
    app.kubernetes.io/name: ticket-queue-db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ticket-queue-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
