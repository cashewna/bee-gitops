apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-queue
  namespace: ticket-queue
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: ticket-queue-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - demo.ticket-queue.khong.dev
      secretName: ticket-queue-demo-tls
  rules:
    - host: demo.ticket-queue.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-queue
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-queue-http
  namespace: ticket-queue
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: ticket-queue-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: demo.ticket-queue.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-queue
                port:
                  name: http
