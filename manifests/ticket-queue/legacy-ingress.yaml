apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-queue-legacy
  namespace: ticket-queue
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: ticket-queue-legacy-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - apps.khong.dev
      secretName: ticket-queue-tls
  rules:
    - host: apps.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-queue
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-queue-legacy-http
  namespace: ticket-queue
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: ticket-queue-legacy-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: apps.khong.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-queue
                port:
                  name: http
