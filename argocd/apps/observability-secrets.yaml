apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-secrets
  namespace: argocd
  annotations:
    # Before the stack: Grafana and Alertmanager mount these Secrets at start.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cashewna/bee-gitops.git
    targetRevision: main
    path: manifests/observability-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
